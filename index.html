<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
:root{
  --color-dark:#0B0A18;
  --color-purple:#6046AF;
  --color-cyan:#92DDEA;
  --color-pink:#FFA5D8;
  --color-soft-purple:#BE9DDF;
  --color-blue:#7EB8DA;
  --color-orange:#e65100;
  --color-bg:#ffffff;
  --color-surface:#f7f7fb;
  --color-border:#ebebf5;
  --color-text:#1a1a2e;
  --color-text-muted:#666680;
  --sidebar-w:260px;
  --rail-w:200px;
  --content-max:780px;
  --scroll-offset:80px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;scroll-padding-top:var(--scroll-offset);}
body{
  font-family:'Khula',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--color-bg);
  color:var(--color-text);
  line-height:1.65;
  font-size:15px;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4,.mono,code,pre,.method-badge,.url-bar,.endpoint-url{font-family:'Inconsolata',monospace;}
a{color:var(--color-purple);text-decoration:none;}
a:hover{text-decoration:underline;}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh;padding-top:60px;}
.sidebar{
  width:var(--sidebar-w);
  flex:0 0 var(--sidebar-w);
  position:fixed;top:60px;left:0;bottom:0;
  background:var(--color-surface);
  border-right:1px solid var(--color-border);
  display:flex;flex-direction:column;
  z-index:200;
}
.main-wrap{
  margin-left:var(--sidebar-w);
  flex:1;
  display:flex;
  justify-content:center;
  min-width:0;
}
.content{
  max-width:var(--content-max);
  width:100%;
  padding:48px 40px 120px;
  min-width:0;
}
.rail{
  width:var(--rail-w);
  flex:0 0 var(--rail-w);
  padding:48px 24px 48px 0;
}
.rail-inner{
  position:sticky;
  top:68px;
}

/* ---------- Sidebar ---------- */
.brand{
  display:flex;align-items:center;gap:10px;
  padding:20px 22px 16px;
}
.brand svg{flex:0 0 auto;}
.brand-name{
  font-family:'Inconsolata',monospace;
  font-weight:700;font-size:20px;
  color:var(--color-text);letter-spacing:-.5px;
}
.search-wrap{padding:14px 18px 14px;position:relative;}
.search-input{
  width:100%;
  padding:9px 12px 9px 34px;
  border:1px solid var(--color-border);
  border-radius:12px;
  background:var(--color-bg);
  font-family:'Khula',sans-serif;
  font-size:13px;
  color:var(--color-text);
  outline:none;
}
.search-input:focus{border-color:var(--color-purple);box-shadow:0 0 0 3px rgba(96,70,175,.12);}
.search-icon{position:absolute;left:30px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);pointer-events:none;}
.search-kbd{
  position:absolute;right:30px;top:50%;transform:translateY(-50%);
  font-family:'Inconsolata',monospace;font-size:11px;
  color:var(--color-text-muted);
  border:1px solid var(--color-border);
  border-radius:5px;padding:1px 5px;background:var(--color-surface);
  pointer-events:none;
}
.nav{flex:1;overflow-y:auto;padding:0 10px 12px;}
.nav-group{margin-bottom:4px;}
.nav-group-title{
  display:flex;align-items:center;justify-content:space-between;
  font-family:'Inconsolata',monospace;
  font-size:11px;font-weight:700;letter-spacing:.6px;
  color:var(--color-text-muted);
  text-transform:uppercase;
  padding:12px 12px 6px;
  cursor:pointer;user-select:none;
}
.nav-group-title .chev{transition:transform .18s;font-size:10px;}
.nav-group.collapsed .chev{transform:rotate(-90deg);}
.nav-group.collapsed .nav-items{display:none;}
.nav-items{display:flex;flex-direction:column;}
.nav-link{
  font-size:13.5px;
  color:var(--color-text-muted);
  padding:5px 12px;
  border-radius:8px;
  cursor:pointer;
  display:block;
  transition:background .12s,color .12s;
  border-left:2px solid transparent;
}
.nav-link:hover{background:rgba(96,70,175,.07);color:var(--color-text);text-decoration:none;}
.nav-link.active{
  color:var(--color-purple);
  font-weight:700;
  background:rgba(96,70,175,.10);
  border-left-color:var(--color-purple);
}
.nav-link.search-hidden{display:none;}
.nav-group.search-hidden{display:none;}
.sidebar-cta{padding:14px 18px;border-top:1px solid var(--color-border);}

/* ---------- Buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  border-radius:16px;
  font-family:'Khula',sans-serif;
  font-weight:700;font-size:14px;
  padding:11px 20px;
  cursor:pointer;border:none;
  transition:transform .1s,box-shadow .15s,background .15s;
  text-decoration:none;
}
.btn:hover{text-decoration:none;}
.btn-primary{background:var(--color-purple);color:#fff;}
.btn-primary:hover{background:#503a93;box-shadow:0 4px 14px rgba(96,70,175,.3);}
.btn-block{width:100%;}
.btn-ghost{background:transparent;border:1px solid var(--color-border);color:var(--color-text);}
.btn-ghost:hover{border-color:var(--color-purple);color:var(--color-purple);}
.btn-sm{padding:7px 14px;font-size:13px;border-radius:12px;}

/* ---------- Site Header ---------- */
.site-header{
  position:fixed;top:0;left:0;right:0;height:60px;
  background:var(--color-bg);
  border-bottom:1px solid var(--color-border);
  z-index:250;
  display:flex;align-items:center;
  padding:0 20px 0 0;
}
.site-header-logo{
  display:flex;align-items:center;gap:8px;
  padding:0 20px;
  text-decoration:none;color:inherit;
  flex-shrink:0;
}
.site-header-logo img{width:28px;height:28px;display:block;}
.site-header-logo .brand-name{
  font-family:'Inconsolata',monospace;
  font-weight:700;font-size:18px;
  color:var(--color-text);letter-spacing:-.5px;
}
.site-header-nav{
  display:flex;align-items:center;gap:2px;
  margin-left:auto;
}
.header-link{
  font-size:14px;font-weight:600;
  color:var(--color-text-muted);
  padding:6px 12px;
  border-radius:8px;
  transition:color .12s,background .12s;
}
.header-link:hover{color:var(--color-text);background:var(--color-surface);text-decoration:none;}
.header-cta{margin-left:8px;}
.hamburger{
  display:none;
  background:none;border:1px solid var(--color-border);
  border-radius:10px;width:38px;height:38px;
  flex-shrink:0;margin:0 4px 0 14px;
  align-items:center;justify-content:center;
  cursor:pointer;color:var(--color-text);
}
.sidebar-overlay{
  display:none;position:fixed;inset:0;background:rgba(11,10,24,.4);z-index:180;
}

/* ---------- Content typography ---------- */
.section{margin-bottom:72px;scroll-margin-top:var(--scroll-offset);}
.section.search-hidden{display:none;}
.section h1{font-size:34px;font-weight:700;letter-spacing:-.5px;margin-bottom:10px;line-height:1.2;}
.section h2{font-size:24px;font-weight:700;margin:0 0 8px;letter-spacing:-.3px;}
.section h3{font-size:17px;font-weight:700;margin:28px 0 10px;}
.section h4{font-size:14px;font-weight:700;margin:20px 0 8px;color:var(--color-text-muted);text-transform:uppercase;letter-spacing:.5px;}
.section p{margin-bottom:14px;color:var(--color-text);}
.muted{color:var(--color-text-muted);}
.lead{font-size:17px;color:var(--color-text-muted);margin-bottom:20px;}
.section ul,.section ol{margin:0 0 16px 22px;}
.section li{margin-bottom:6px;}
hr.div{border:none;border-top:1px solid var(--color-border);margin:36px 0;}

/* inline code pill */
code.pill,p code,li code,td code{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:6px;
  padding:1px 6px;
  font-size:13px;
  color:var(--color-purple);
}
.type-pill{
  background:var(--color-surface);
  border:1px solid var(--color-border);
  border-radius:6px;padding:1px 7px;font-size:12.5px;
  font-family:'Inconsolata',monospace;color:var(--color-purple);
  display:inline-block;
}

/* ---------- Hero ---------- */
.hero{
  background:var(--color-dark);
  border-radius:20px;
  padding:36px 36px;
  margin-bottom:34px;
  position:relative;overflow:hidden;
}
.hero h2{color:#fff;font-size:24px;margin-bottom:8px;}
.hero p{color:var(--color-soft-purple);margin-bottom:20px;}
.hero .btn-primary{background:var(--color-cyan);color:var(--color-dark);}
.hero .btn-primary:hover{background:#a8e6f1;}
.hero-deco{position:absolute;right:-30px;top:-30px;opacity:.18;color:var(--color-soft-purple);}

/* ---------- Stats ---------- */
.stats{display:flex;gap:14px;margin:26px 0;flex-wrap:wrap;}
.stat{
  flex:1;min-width:140px;
  border:1px solid var(--color-border);
  border-radius:16px;padding:18px 20px;
  background:var(--color-surface);
}
.stat .num{font-family:'Inconsolata',monospace;font-size:26px;font-weight:700;color:var(--color-purple);}
.stat .lbl{font-size:13px;color:var(--color-text-muted);}

/* ---------- Tables ---------- */
.table-wrap{overflow-x:auto;border:1px solid var(--color-border);border-radius:14px;margin:14px 0 18px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  background:var(--color-surface);
  text-align:left;font-weight:700;
  padding:10px 14px;border-bottom:1px solid var(--color-border);
  font-family:'Inconsolata',monospace;font-size:12.5px;
  letter-spacing:.3px;color:var(--color-text);
  white-space:nowrap;
}
tbody td{padding:9px 14px;border-bottom:1px solid var(--color-border);vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:rgba(96,70,175,.03);}
.req-badge{
  background:var(--color-purple);color:#fff;
  font-family:'Inconsolata',monospace;font-size:10.5px;font-weight:700;
  padding:1px 7px;border-radius:6px;letter-spacing:.3px;
  text-transform:uppercase;white-space:nowrap;
}
.opt-badge{
  color:var(--color-text-muted);font-size:12px;font-style:normal;
}

/* ---------- Endpoint card ---------- */
.endpoint{margin-top:8px;}
.method-row{
  display:flex;align-items:stretch;gap:0;
  border-radius:10px;overflow:hidden;
  margin:8px 0 18px;
  border:1px solid var(--color-border);
}
.method-badge{
  display:flex;align-items:center;
  font-weight:700;font-size:13px;
  padding:0 16px;
  letter-spacing:.5px;
  color:#fff;background:var(--color-purple);
}
.method-badge.post{background:var(--color-cyan);color:var(--color-dark);}
.url-bar{
  flex:1;
  background:var(--color-dark);
  color:#fff;
  display:flex;align-items:center;
  padding:10px 14px;
  font-size:13.5px;
  overflow-x:auto;white-space:nowrap;
  gap:10px;
}
.url-bar .u{flex:1;}
.copy-btn{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
  color:#cfcfe6;
  border-radius:7px;
  font-family:'Inconsolata',monospace;font-size:11px;
  padding:4px 9px;cursor:pointer;white-space:nowrap;
  transition:background .12s,color .12s;
}
.copy-btn:hover{background:rgba(255,255,255,.16);color:#fff;}
.copy-btn.copied{background:var(--color-cyan);color:var(--color-dark);border-color:var(--color-cyan);}

/* ---------- Code examples ---------- */
.code-block{margin:14px 0 18px;border-radius:12px;overflow:hidden;border:1px solid #23223a;}
.tabs{
  display:flex;background:#15142a;border-bottom:1px solid #23223a;
  overflow-x:auto;
}
.tab{
  font-family:'Inconsolata',monospace;font-size:12.5px;
  color:#9b9bc0;padding:9px 15px;cursor:pointer;
  border:none;background:none;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .12s;
}
.tab:hover{color:#fff;}
.tab.active{color:var(--color-cyan);border-bottom-color:var(--color-cyan);}
.code-pane{position:relative;display:none;}
.code-pane.active{display:block;}
.code-pane pre{margin:0;padding:0;}
.code-pane pre code.hljs{
  background:var(--color-dark)!important;
  padding:16px 16px 16px;
  font-size:13px;line-height:1.6;
  display:block;overflow-x:auto;
}
.code-pane .copy-btn{position:absolute;top:9px;right:9px;z-index:2;}

/* single code (no tabs) */
.code-single{position:relative;margin:14px 0 18px;border-radius:12px;overflow:hidden;border:1px solid #23223a;}
.code-single pre{margin:0;}
.code-single pre code.hljs{background:var(--color-dark)!important;padding:16px;font-size:13px;line-height:1.6;display:block;overflow-x:auto;}
.code-single .copy-btn{position:absolute;top:9px;right:9px;z-index:2;}

/* ---------- Collapsible / response attrs ---------- */
.collapse{border:1px solid var(--color-border);border-radius:12px;margin:14px 0 18px;overflow:hidden;}
.collapse-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 16px;cursor:pointer;user-select:none;
  background:var(--color-surface);
  font-family:'Inconsolata',monospace;font-weight:700;font-size:13.5px;
}
.collapse-head .chev{transition:transform .18s;font-size:11px;color:var(--color-text-muted);}
.collapse.open .chev{transform:rotate(90deg);}
.collapse-body{display:none;padding:6px 16px 12px;}
.collapse.open .collapse-body{display:block;}
.attr{
  display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--color-border);
  font-size:13px;flex-wrap:wrap;
}
.attr:last-child{border-bottom:none;}
.attr .a-name{font-family:'Inconsolata',monospace;font-weight:700;color:var(--color-text);}
.attr .a-type{font-family:'Inconsolata',monospace;color:var(--color-blue);font-size:12px;}
.attr .a-desc{color:var(--color-text-muted);flex:1;min-width:180px;}

/* ---------- Endpoint Section Tabs ---------- */
.ep-tabbar{
  display:flex;gap:0;
  border-bottom:2px solid var(--color-border);
  margin:18px 0 0;
  overflow-x:auto;scrollbar-width:none;
}
.ep-tabbar::-webkit-scrollbar{display:none;}
.ep-tab{
  padding:9px 18px;
  border:none;background:none;
  font-family:'Khula',sans-serif;font-size:14px;font-weight:600;
  color:var(--color-text-muted);cursor:pointer;
  border-bottom:2px solid transparent;
  margin-bottom:-2px;white-space:nowrap;
  transition:color .15s,border-color .15s;
}
.ep-tab:hover{color:var(--color-text);}
.ep-tab.active{color:var(--color-purple);border-bottom-color:var(--color-purple);}
.ep-pane{display:none;padding-top:18px;}
.ep-pane.active{display:block;}
.tryit-inline{padding:4px 0;}
.brand-logo{max-height:30px;width:auto;display:block;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:4px;color:var(--color-text);}
.field .req-badge{margin-left:6px;}
.field-input-wrap{position:relative;}
.field input{
  width:100%;padding:9px 12px;border:1px solid var(--color-border);
  border-radius:10px;font-family:'Inconsolata',monospace;font-size:13px;
  background:var(--color-bg);color:var(--color-text);outline:none;
}
.field input:focus{border-color:var(--color-purple);box-shadow:0 0 0 3px rgba(96,70,175,.12);}
.field input.key-input{padding-left:32px;}
.lock-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);pointer-events:none;}
.try-result{
  margin-top:14px;border-radius:10px;overflow:hidden;display:none;border:1px solid #23223a;
}
.try-result.show{display:block;}
.try-status{
  font-family:'Inconsolata',monospace;font-size:12.5px;padding:7px 14px;
  display:flex;justify-content:space-between;align-items:center;
}
.try-status.ok{background:rgba(146,221,234,.15);color:#0b7285;}
.try-status.err{background:rgba(255,165,216,.18);color:#a61e6a;}
.try-result pre{margin:0;}
.try-result pre code.hljs{background:var(--color-dark)!important;padding:14px;font-size:12.5px;max-height:380px;overflow:auto;display:block;}
.post-note{
  background:rgba(146,221,234,.14);border:1px solid var(--color-cyan);
  border-radius:10px;padding:12px 14px;font-size:13.5px;color:#0b6a7a;
}

/* ---------- after-endpoint CTA ---------- */
.endpoint-cta{
  font-size:13px;color:var(--color-text-muted);
  margin:14px 0 0;
}
.endpoint-cta a{font-weight:700;}

/* ---------- callouts ---------- */
.callout{
  border:1px solid var(--color-border);border-left:3px solid var(--color-purple);
  background:var(--color-surface);border-radius:10px;padding:14px 16px;margin:16px 0;
  font-size:13.5px;
}
.callout.cyan{border-left-color:var(--color-cyan);}
.callout.pink{border-left-color:var(--color-pink);}
.callout strong{color:var(--color-text);}

/* ---------- right rail ---------- */
.rail-title{
  font-family:'Inconsolata',monospace;font-size:11px;font-weight:700;
  text-transform:uppercase;letter-spacing:.6px;color:var(--color-text-muted);
  margin-bottom:10px;
}
.rail-link{
  display:block;font-size:12.5px;color:var(--color-text-muted);
  padding:4px 0 4px 12px;border-left:2px solid var(--color-border);
  cursor:pointer;transition:color .12s,border-color .12s;
}
.rail-link:hover{color:var(--color-text);text-decoration:none;}
.rail-link.active{color:var(--color-purple);border-left-color:var(--color-purple);font-weight:700;}

/* ---------- SDK cards ---------- */
.sdk-card{border:1px solid var(--color-border);border-radius:16px;padding:20px 22px;margin-bottom:18px;background:var(--color-surface);}
.sdk-head{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:6px;}
.sdk-head h3{margin:0;}
.badge-soon{background:var(--color-pink);color:var(--color-dark);font-family:'Inconsolata',monospace;font-size:11px;font-weight:700;padding:2px 9px;border-radius:6px;text-transform:uppercase;letter-spacing:.3px;}

/* vessel types search */
.vt-search{
  width:100%;max-width:420px;padding:10px 14px;border:1px solid var(--color-border);
  border-radius:12px;font-family:'Khula',sans-serif;font-size:14px;margin:6px 0 14px;outline:none;
}
.vt-search:focus{border-color:var(--color-purple);box-shadow:0 0 0 3px rgba(96,70,175,.12);}
.vt-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:8px;}
.vt-tag{
  font-family:'Inconsolata',monospace;font-size:12.5px;
  border:1px solid var(--color-border);background:var(--color-surface);
  border-radius:8px;padding:4px 10px;color:var(--color-text);
}
.vt-tag.vt-hidden{display:none;}
.vt-count{font-size:12.5px;color:var(--color-text-muted);margin-bottom:8px;}

@media (max-width:1100px){
  .rail{display:none;}
}
@media (max-width:768px){
  .sidebar{
    transform:translateX(-100%);
    transition:transform .22s ease;
    width:280px;flex-basis:280px;
    box-shadow:0 0 30px rgba(0,0,0,.2);
  }
  .sidebar.open{transform:translateX(0);}
  .sidebar-overlay.show{display:block;}
  .main-wrap{margin-left:0;}
  .hamburger{display:flex;}
  .site-header-nav .header-link,.site-header-nav .header-cta{display:none;}
  .content{padding:80px 18px 90px;}
  .rail{display:none;}
  .section h1{font-size:27px;}
  .hero{padding:26px 22px;}
}
.no-results{padding:40px 0;text-align:center;color:var(--color-text-muted);display:none;}
.no-results.show{display:block;}

/* Add-on badge pill */
.badge-addon {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: #fff3e0;
  color: var(--color-orange);
  border: 1px solid #ffcc80;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 700;
  padding: 2px 8px;
  font-family: 'Khula', sans-serif;
  letter-spacing: 0.03em;
  white-space: nowrap;
  vertical-align: middle;
}

/* Add-on callout banner on endpoint cards */
.addon-callout {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  background: #fff8f0;
  border: 1px solid #ffcc80;
  border-left: 4px solid var(--color-orange);
  border-radius: 8px;
  padding: 12px 16px;
  margin-bottom: 20px;
  font-family: 'Khula', sans-serif;
  font-size: 14px;
  color: #5d3a00;
  line-height: 1.5;
}
.addon-callout .addon-callout-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}
.addon-callout a {
  color: var(--color-orange);
  text-decoration: underline;
  font-weight: 600;
}

/* Orange separator between nav groups */
.nav-group + .nav-group {
  border-top: 1px solid #ffcc80;
  padding-top: 4px;
}

/* Add-on nav items */
.nav-link.addon-item {
  color: var(--color-text-muted);
}
.nav-link.addon-item .addon-pip {
  font-size: 10px;
  margin-right: 2px;
  opacity: 0.8;
}
.nav-link.addon-item.active,
.nav-link.addon-item:hover {
  color: var(--color-orange);
}

/* Plan overview cards in Introduction */
.plan-overview {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin: 24px 0;
}
@media (max-width: 640px) {
  .plan-overview { grid-template-columns: 1fr; }
}
.plan-card {
  border: 1px solid var(--color-border);
  border-radius: 10px;
  padding: 20px;
  background: var(--color-surface);
}
.plan-card.core { border-top: 3px solid var(--color-purple); }
.plan-card.addons { border-top: 3px solid var(--color-orange); }
.plan-card h4 {
  font-family: 'Inconsolata', monospace;
  font-size: 15px;
  font-weight: 700;
  margin: 0 0 12px;
  color: var(--color-dark);
  display: flex;
  align-items: center;
  gap: 8px;
}
.plan-card ul {
  margin: 0;
  padding: 0;
  list-style: none;
}
.plan-card ul li {
  font-family: 'Khula', sans-serif;
  font-size: 13px;
  color: var(--color-text-muted);
  padding: 3px 0;
  display: flex;
  align-items: center;
  gap: 6px;
}
.plan-card ul li::before {
  content: '•';
  color: var(--color-purple);
  font-weight: 700;
  flex-shrink: 0;
}
.plan-card.addons ul li::before { color: var(--color-orange); }
.plan-card .plan-note {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--color-border);
  font-size: 12px;
  color: var(--color-text-muted);
  font-family: 'Khula', sans-serif;
  font-style: italic;
}

/* Credit table section headers */
.credit-section-head {
  font-family: 'Khula', sans-serif;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  padding: 8px 12px;
  background: var(--color-surface);
  color: var(--color-text-muted);
  border-bottom: 1px solid var(--color-border);
}
.credit-section-head.addon-head {
  color: var(--color-orange);
  background: #fff8f0;
}
</style>
</head>

/* helper to build code examples for a standard GET endpoint */
function genGetExamples(base, path, params){
  const qs = Object.entries(params).map(([k,v])=>`${k}=${v}`).join('&');
  const urlNoKey = qs ? `${base}${path}?${qs}` : `${base}${path}`;
  const pyParams = Object.entries(params).map(([k,v])=>`    '${k}': '${v}'`).join(',\n');
  const nodeParams = Object.entries(params).map(([k,v])=>`${k}: '${v}'`).join(', ');
  const goAdds = Object.entries(params).map(([k,v])=>`    q.Add("${k}", "${v}")`).join('\n');
  const rubyParams = Object.entries(params).map(([k,v])=>`${k}: '${v}'`).join(', ');
  const phpParams = Object.entries(params).map(([k,v])=>`'${k}' => '${v}'`).join(', ');
  return {
    curl:`curl -H "x-api-key: YOUR_API_KEY" "${urlNoKey}"`,
    python:`import requests
import json

headers = {'x-api-key': 'YOUR_API_KEY'}
params = {
${pyParams}
}
api_base = '${base}'
api_result = requests.get(api_base + '${path}', params=params, headers=headers)
api_response = api_result.json()
print(json.dumps(api_response, indent=4, sort_keys=True))`,
    node:`const request = require("request");
const api_key = "YOUR_API_KEY";
const api_base = "${base}";

function apiCall(method, params, cb) {
  request.get({url: \`\${api_base}\${method}\`, qs: params, headers: {'x-api-key': api_key}}, cb);
}

apiCall('${path}', {${nodeParams}}, (err, res, body) => {
  console.log(body);
});`,
    go:`package main

import (
    "fmt"
    "net/http"
    "io"
)

func main() {
    url := "${base}${path}"
    req, _ := http.NewRequest("GET", url, nil)
    req.Header.Set("x-api-key", "YOUR_API_KEY")
    q := req.URL.Query()
${goAdds}
    req.URL.RawQuery = q.Encode()
    res, _ := http.DefaultClient.Do(req)
    defer res.Body.Close()
    body, _ := io.ReadAll(res.Body)
    fmt.Println(string(body))
}`,
    ruby:`require 'net/http'
require 'json'

def api_call(method, params)
  api_key = "YOUR_API_KEY"
  api_base = "${base}"
  uri = URI("#{api_base}#{method}")
  uri.query = URI.encode_www_form(params)
  req = Net::HTTP::Get.new(uri)
  req['x-api-key'] = api_key
  res = Net::HTTP.start(uri.hostname, uri.port, use_ssl: true) { |http| http.request(req) }
  JSON.parse(res.body)
end

puts JSON.pretty_generate(api_call('${path}', {${rubyParams}}))`,

    $url = $api_base . $method . '?' . http_build_query($params);
    $c = curl_init($url);
    curl_setopt($c, CURLOPT_RETURNTRANSFER, true);
    curl_setopt($c, CURLOPT_HTTPHEADER, ['x-api-key: ' . $api_key]);
    $res = json_decode(curl_exec($c), true);

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function paramsTable(params){
  const rows = params.map(([name,type,req,desc])=>{
    let reqCell;
    if(req==="required") reqCell=`<span class="req-badge">required</span>`;
    else if(req==="optional") reqCell=`<span class="opt-badge">optional</span>`;
    else reqCell=`<span class="opt-badge">${esc(req)}</span>`;
    return `<tr>
      <td><code>${esc(name)}</code></td>
      <td><span class="type-pill">${esc(type)}</span></td>
      <td>${reqCell}</td>
      <td>${esc(desc)}</td>
    </tr>`;
  }).join('');
  return `<div class="table-wrap"><table>
    <thead><tr><th>Parameter</th><th>Type</th><th>Required</th><th>Description</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}

let cbId=0;
function codeBlock(lang,code){
  return `<div class="code-pane" data-lang="${lang}">
    <button class="copy-btn" data-copy>Copy</button>
    <pre><code class="language-${lang}">${esc(code)}</code></pre>
  </div>`;
}
const LANGS=[["bash","cURL"],["python","Python"],["javascript","Node.js"],["go","Go"],["ruby","Ruby"],["php","PHP"],["java","Java"]];
function codeTabs(ex){
  const map={bash:ex.curl,python:ex.python,javascript:ex.node,go:ex.go,ruby:ex.ruby,php:ex.php,java:ex.java};
  const tabs=LANGS.map(([l,label],i)=>`<button class="tab${i===0?' active':''}" role="tab" aria-selected="${i===0?'true':'false'}" data-tab="${l}">${label}</button>`).join('');
  const panes=LANGS.map(([l],i)=>{
    const c=codeBlock(l,map[l]||'');
    return c.replace('class="code-pane"',`class="code-pane${i===0?' active':''}" role="tabpanel"`);
  }).join('');
  return `<div class="code-block">
    <div class="tabs" role="tablist" aria-label="Code language">${tabs}</div>
    ${panes}
  </div>`;
}
function singleCode(lang,code){
  return `<div class="code-single">
    <button class="copy-btn" data-copy>Copy</button>
    <pre><code class="language-${lang}">${esc(code)}</code></pre>
  </div>`;
}

function attrsCollapse(attrs){
  const rows=attrs.map(([n,t,d])=>`<div class="attr">
    <span class="a-name">${esc(n)}</span>
    ${t?`<span class="a-type">${esc(t)}</span>`:''}
    <span class="a-desc">${esc(d)}</span>
  </div>`).join('');
  return `<div class="collapse">
    <div class="collapse-head" data-collapse><span>Response Attributes</span><span class="chev">▶</span></div>
    <div class="collapse-body">${rows}</div>
  </div>`;
}

function tryItContent(key,ep){
  const keyField=`<div class="field">
    <label>x-api-key <span class="req-badge">required</span></label>
    <div class="field-input-wrap">
      <svg class="lock-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      <input type="password" class="key-input" data-apikey placeholder="Your API key (stored locally)">
    </div>
  </div>`;
  const fields=(ep.tryParams||[]).map(p=>`<div class="field">
    <label>${esc(p.name)}${p.required?' <span class="req-badge">required</span>':''}</label>
    <div class="field-input-wrap"><input type="text" data-param="${esc(p.name)}" value="${esc(p.def||'')}"></div>
  </div>`).join('');
  return `<div class="tryit-inline" data-endpoint="${key}">
    <div class="callout-warn" style="background:#fffbeb;border-left:3px solid #f59e0b;color:#78350f;padding:8px 12px;border-radius:4px;font-size:13px;margin-bottom:12px">⚡ Live request: sends a real API call and deducts credits from your account.</div>
    ${keyField}
    ${fields}
    <button class="btn btn-primary btn-sm" data-send>Send Request →</button>
    <div class="try-result">
      <div class="try-status"></div>
      <pre><code class="language-json" data-result></code></pre>
    </div>
  </div>`;
}

/* render a full endpoint card */
function renderEndpoint(key){
  const ep=ENDPOINTS[key];
  const isGet=ep.method!=="POST";
  const fullUrl=`${ep.base}${ep.path}`;
  const badge=isGet?'<span class="method-badge">GET</span>':'<span class="method-badge post">POST</span>';
  const examples=ep.examples||genGetExamples(ep.base,ep.path,Object.fromEntries((ep.tryParams||[]).map(p=>[p.name,p.def])));
  const bulk=ep.bulkType?`<div class="callout cyan"><strong>Bulk download available.</strong> For the entire dataset, submit an async report: <code>POST /api/v0/report</code> with <code>report_type: "${ep.bulkType}"</code> and an optional <code>updated_from</code> parameter. See <a data-nav="async-reports">Async Reports</a>.</div>`:'';
  const addonCallout=ep.addon?`<div class="addon-callout">
        <span class="addon-callout-icon">➕</span>
        <span>This is an <strong>Add-On endpoint</strong>, available on Add-Ons plan tiers (Starter+Add-Ons, Experimenter+Add-Ons, Developer Pro+Add-Ons). Upgrade to an Add-Ons plan to get access. Your API key stays the same and automatically gains access once your plan includes Add-Ons. <a href="${PRICING}" target="_blank" rel="noopener">View pricing →</a></span>
      </div>`:'';
  const tabBar=`<div class="ep-tabbar">
    <button class="ep-tab active" data-eptab="params">Parameters</button>
    <button class="ep-tab" data-eptab="code">Code Examples</button>
    <button class="ep-tab" data-eptab="response">Response</button>
    ${isGet?'<button class="ep-tab" data-eptab="tryit">Try It ⚡</button>':''}
  </div>`;
  return `
    <div class="endpoint">
      ${addonCallout}
      ${ep.note?`<div class="callout">${ep.note}</div>`:''}
      ${ep.warn?`<div class="callout pink">${ep.warn}</div>`:''}
      <div class="method-row">
        ${badge}
        <div class="url-bar"><span class="u">${esc(fullUrl)}</span><button class="copy-btn" data-copy data-text="${esc(fullUrl)}">Copy</button></div>
      </div>
      <p>${ep.desc}</p>
      ${tabBar}
      <div class="ep-pane active" data-eptabpane="params">
        ${paramsTable(ep.params)}
      </div>
      <div class="ep-pane" data-eptabpane="code">
        ${codeTabs(examples)}
      </div>
      <div class="ep-pane" data-eptabpane="response">
        ${attrsCollapse(ep.attrs)}
        ${singleCode('json',ep.response)}
        ${bulk}
      </div>
      ${isGet?`<div class="ep-pane" data-eptabpane="tryit">${tryItContent(key,ep)}</div>`:''}
      <p class="endpoint-cta">Don't have an API key yet? <a href="${PRICING}" target="_blank" rel="noopener">Get one →</a></p>
    </div>`;
}

function endpointSection(key){
  const ep=ENDPOINTS[key];
  const addonBadge=ep.addon?' <span class="badge-addon">➕ Add-On</span>':'';
  return `<section class="section" id="${key}" data-title="${esc(TITLES[key])}">
    <h1>${esc(TITLES[key])}${addonBadge}</h1>
    ${renderEndpoint(key)}
  </section>`;
}

function scrollToId(id){
  const el=document.getElementById(id);
  if(!el) return;
  const y=el.getBoundingClientRect().top+window.scrollY-80;
  window.scrollTo({top:y,behavior:'smooth'});
}

function setActiveNav(id){
  document.querySelectorAll('.nav-link').forEach(l=>l.classList.toggle('active',l.dataset.nav===id));
}

/* highlight one code element */
function hl(el){ if(window.hljs){ try{hljs.highlightElement(el);}catch(e){} } }

function initInteractions(){
  // group collapse
  document.querySelectorAll('[data-grouptoggle]').forEach(t=>{
    t.addEventListener('click',()=>t.closest('.nav-group').classList.toggle('collapsed'));
  });
  // nav links + any data-nav anchors in content
  document.body.addEventListener('click',e=>{
    const navEl=e.target.closest('[data-nav]');
    if(navEl){
      e.preventDefault();
      const id=navEl.dataset.nav;
      scrollToId(id); setActiveNav(id);
      closeSidebar();
      return;
    }
    // copy buttons
    const cp=e.target.closest('[data-copy]');
    if(cp){ doCopy(cp); return; }
    // endpoint section tabs (Parameters / Code Examples / Response / Try It)
    const eptab=e.target.closest('[data-eptab]');
    if(eptab){
      const card=eptab.closest('.endpoint');
      card.querySelectorAll('.ep-tab').forEach(t=>t.classList.remove('active'));
      card.querySelectorAll('.ep-pane').forEach(p=>p.classList.remove('active'));
      eptab.classList.add('active');
      const pane=card.querySelector(`[data-eptabpane="${eptab.dataset.eptab}"]`);
      if(pane) pane.classList.add('active');
      return;
    }
    // code tabs (language switcher inside Code Examples pane)
    const tab=e.target.closest('.tab');
    if(tab){
      const block=tab.closest('.code-block');
      block.querySelectorAll('.tab').forEach(t=>{t.classList.toggle('active',t===tab);t.setAttribute('aria-selected',t===tab?'true':'false');});
      block.querySelectorAll('.code-pane').forEach(p=>p.classList.toggle('active',p.dataset.lang===tab.dataset.tab));
      return;
    }
    // collapse (response attrs)
    const ch=e.target.closest('[data-collapse]');
    if(ch){ ch.closest('.collapse').classList.toggle('open'); return; }
    // send request
    const send=e.target.closest('[data-send]');
    if(send){ sendTry(send); return; }
  });
}

function doCopy(btn){
  const text=btn.dataset.text || btn.parentElement.querySelector('code')?.textContent || '';
  if(!text.trim()){
    const orig=btn.textContent;
    btn.textContent='Failed'; btn.style.color='#e53e3e';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},2000);
    return;
  }
  navigator.clipboard.writeText(text).then(()=>{
    const orig=btn.textContent;
    btn.textContent='Copied!'; btn.classList.add('copied');
    setTimeout(()=>{btn.textContent=orig;btn.classList.remove('copied');},2000);
  }).catch(()=>{
    const orig=btn.textContent;
    btn.textContent='Failed'; btn.style.color='#e53e3e';
    setTimeout(()=>{btn.textContent=orig;btn.style.color='';},2000);
  });
}

/* ---------- Try It ---------- */
const KEY_STORE='datalastic_api_key';
function syncApiKeyInputs(val){
  document.querySelectorAll('[data-apikey]').forEach(i=>{if(i.value!==val)i.value=val;});
}
function initApiKey(){
  let saved='';
  try{ saved=localStorage.getItem(KEY_STORE)||''; }catch(e){ saved=''; }
  syncApiKeyInputs(saved);
  document.body.addEventListener('input',e=>{
    const k=e.target.closest('[data-apikey]');
    if(k){ try{ localStorage.setItem(KEY_STORE,k.value); }catch(e){} syncApiKeyInputs(k.value); }
  });
}

function sendTry(btn){
  const panel=btn.closest('.tryit-inline');
  const key=panel.dataset.endpoint;
  const ep=ENDPOINTS[key];
  if(!ep) return;
  const apiKey=panel.querySelector('[data-apikey]').value.trim();
  const resultBox=panel.querySelector('.try-result');
  const statusEl=panel.querySelector('.try-status');
  const codeEl=panel.querySelector('[data-result]');
  resultBox.classList.add('show');

  if(!apiKey){
    statusEl.className='try-status err';
    statusEl.innerHTML='<span>Missing API key</span><span>400</span>';
    codeEl.textContent='Enter your API key above to send a live request.';
    codeEl.removeAttribute('data-highlighted'); codeEl.className='language-json'; hl(codeEl);
    return;
  }
  const params=new URLSearchParams();
  panel.querySelectorAll('[data-param]').forEach(inp=>{
    if(inp.value.trim()!=='') params.set(inp.dataset.param,inp.value.trim());
  });
  const qs=params.toString();
  const url=`${ep.base}${ep.path}${qs?'?'+qs:''}`;
  statusEl.className='try-status';
  statusEl.innerHTML='<span>Sending…</span><span></span>';
  codeEl.textContent='';
  btn.disabled=true; const blbl=btn.textContent; btn.textContent='Sending…';

  fetch(url,{headers:{'x-api-key':apiKey}}).then(async res=>{
    const text=await res.text();
    let bodyText, json;
    try{ json=JSON.parse(text); bodyText=JSON.stringify(json,null,2); }
    catch(e){ bodyText=text||'(no body)'; }
    const ok=res.ok && (!json || json.meta?.success!==false);
    statusEl.className='try-status '+(ok?'ok':'err');
    statusEl.innerHTML=`<span>${ok?'Success':'Error'}</span><span>HTTP ${res.status}</span>`;
    codeEl.textContent=bodyText;
    codeEl.removeAttribute('data-highlighted'); codeEl.className='language-json'; hl(codeEl);
  }).catch(err=>{
    statusEl.className='try-status err';
    statusEl.innerHTML=`<span>Network / CORS error</span><span>n/a</span>`;
    codeEl.textContent='Request failed: '+err.message+'\n\nSome browsers block cross-origin requests. Use the code examples above to run this request from your server.';
    codeEl.removeAttribute('data-highlighted'); codeEl.className='language-json'; hl(codeEl);
  }).finally(()=>{ btn.disabled=false; btn.textContent=blbl; });
}

/* ---------- Sidebar (mobile) ---------- */
let trapFocus=null;
function openSidebar(){
  const sidebar=document.getElementById('sidebar');
  sidebar.classList.add('open');
  document.getElementById('overlay').classList.add('show');
  const focusables=[...sidebar.querySelectorAll('a, button, input, [tabindex]:not([tabindex="-1"])')].filter(el=>el.offsetParent!==null || el===document.activeElement);
  const list=focusables.length?focusables:[...sidebar.querySelectorAll('a, button, input, [tabindex]:not([tabindex="-1"])')];
  const first=list[0], last=list[list.length-1];
  trapFocus=function(e){
    if(e.key==='Escape'){ closeSidebar(); return; }
    if(e.key!=='Tab') return;
    if(!list.length) return;
    if(e.shiftKey){
      if(document.activeElement===first || !sidebar.contains(document.activeElement)){ e.preventDefault(); last.focus(); }
    }else{
      if(document.activeElement===last || !sidebar.contains(document.activeElement)){ e.preventDefault(); first.focus(); }
    }
  };
  document.addEventListener('keydown',trapFocus);
  if(first) first.focus();
}
function closeSidebar(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
  if(trapFocus){
    document.removeEventListener('keydown',trapFocus); trapFocus=null;
    const hb=document.getElementById('hamburger');
    if(hb) hb.focus();
  }
}
function initSidebar(){
  document.getElementById('hamburger').addEventListener('click',()=>{
    document.getElementById('sidebar').classList.contains('open')?closeSidebar():openSidebar();
  });
  document.getElementById('overlay').addEventListener('click',closeSidebar);
}

/* ---------- Search ---------- */
function initSearch(){
  const input=document.getElementById('navSearch');
  const noResEl=document.getElementById('navNoResults');
  const noRes=show=>{ if(noResEl) noResEl.style.display=show?'block':'none'; };
  let prevQ='';
  function filter(){
    const q=input.value.trim().toLowerCase();
    let anyVisible=false;
    // nav links
    NAV.forEach(g=>{
      const groupEl=document.querySelector(`.nav-group[data-group="${cssEsc(g.group)}"]`);
      let groupHas=false;
      g.items.forEach(id=>{
        const link=groupEl.querySelector(`.nav-link[data-nav="${id}"]`);
        const match=q==='' || TITLES[id].toLowerCase().includes(q) || id.toLowerCase().includes(q);
        link.classList.toggle('search-hidden',!match);
        if(match)groupHas=true;
      });
      groupEl.classList.toggle('search-hidden',!groupHas);
      if(groupHas)anyVisible=true;
    });
    // sections
    document.querySelectorAll('.section').forEach(sec=>{
      const t=(sec.dataset.title||'').toLowerCase();
      const match=q==='' || t.includes(q) || sec.id.toLowerCase().includes(q) || sec.textContent.toLowerCase().includes(q);
      sec.classList.toggle('search-hidden',!match);
    });
    noRes(!anyVisible);
    // when clearing search, re-fire the IntersectionObserver for the current viewport
    if(prevQ!=='' && q===''){ window.dispatchEvent(new Event('scroll')); }
    prevQ=q;
  }
  input.addEventListener('input',filter);
  document.addEventListener('keydown',e=>{
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus();input.select();}
    if(e.key==='Escape'&&document.activeElement===input){input.value='';filter();input.blur();}
  });
}
function cssEsc(s){return s.replace(/"/g,'\\"');}

/* ---------- Field Reference + Vessel Types search ---------- */
function initFilters(){
  const fr=document.getElementById('frSearch');
  if(fr){
    fr.addEventListener('input',()=>{
      const q=fr.value.trim().toLowerCase();
      document.querySelectorAll('#frTable .fr-row').forEach(r=>{
        r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';
      });
    });
  }
  const vt=document.getElementById('vtSearch');
  if(vt){
    const count=document.getElementById('vtCount');
    const tags=()=>document.querySelectorAll('#vtMain .vt-tag, #vtSub .vt-tag');
    const update=()=>{
      const q=vt.value.trim().toLowerCase();
      let shown=0;
      tags().forEach(t=>{
        const m=t.textContent.toLowerCase().includes(q);
        t.classList.toggle('vt-hidden',!m); if(m)shown++;
      });
      count.textContent=`${shown} of ${tags().length} shown`;
    };
    vt.addEventListener('input',update); update();
  }
}

/* ---------- IntersectionObserver active nav + rail ---------- */
let railIds=[];
function buildRail(currentId){
  const sec=document.getElementById(currentId);
  const rail=document.getElementById('railLinks');
  if(!sec){rail.innerHTML='';return;}
  const heads=[...sec.querySelectorAll('h3, h4')].filter(h=>h.textContent.trim()!=='');
  if(heads.length<2){rail.innerHTML='';document.querySelector('.rail').style.visibility='hidden';return;}
  document.querySelector('.rail').style.visibility='';
  railIds=[];
  rail.innerHTML=heads.map((h,i)=>{
    if(!h.id) h.id=currentId+'-h-'+i;
    railIds.push(h.id);
    return `<span class="rail-link" data-raillink="${h.id}">${esc(h.textContent)}</span>`;
  }).join('');
  rail.querySelectorAll('[data-raillink]').forEach(l=>{
    l.addEventListener('click',()=>scrollToId(l.dataset.raillink));
  });
}
function initObserver(){
  const sections=[...document.querySelectorAll('.section')];
  let current=null;
  let obsTimer=null;
  const secObs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        const id=en.target.id;
        if(id!==current){
          current=id;
          clearTimeout(obsTimer);
          obsTimer=setTimeout(()=>{
            setActiveNav(id);
            try{ history.replaceState(null,'','#'+id); }catch(e){}
            buildRail(id);
          },250);
        }
      }
    });
  },{rootMargin:'-80px 0px -65% 0px',threshold:0});
  sections.forEach(s=>secObs.observe(s));

  // rail sub-highlight
  const railObs=new IntersectionObserver(entries=>{
    entries.forEach(en=>{
      if(en.isIntersecting){
        document.querySelectorAll('.rail-link').forEach(l=>l.classList.toggle('active',l.dataset.raillink===en.target.id));
      }
    });
  },{rootMargin:'-80px 0px -70% 0px',threshold:0});
  // observe headings (re-run when rail rebuilds)
  const mo=new MutationObserver(()=>{
    railIds.forEach(id=>{const el=document.getElementById(id);if(el)railObs.observe(el);});
  });
  mo.observe(document.getElementById('railLinks'),{childList:true});
}

/* ---------- init ---------- */
document.addEventListener('DOMContentLoaded',()=>{
  buildNav();
  buildContent();
  // syntax highlight all code blocks
  if(window.hljs){
    document.querySelectorAll('pre code').forEach(el=>{ if(!el.hasAttribute('data-result')) hl(el); });
  }
  initInteractions();
  initApiKey();
  initSidebar();
  initSearch();
  initFilters();
  initObserver();
  // open hash target / default
  const hash=location.hash.slice(1);
  if(hash && document.getElementById(hash)){ setTimeout(()=>scrollToId(hash),50); setActiveNav(hash);}
  else setActiveNav('introduction');
});
